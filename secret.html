<!DOCTYPE html>
<html>
<head>
  <title>For Isa</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 80px 20px;
      background: #ffffff;
      color: #111111;
      transition: background 1.2s ease;
    }
    body.celebrate {
      background: linear-gradient(135deg, #ffe4ef, #ffffff, #ffc2dd);
      color: #111111;
    }
    h1 {
      font-size: 22px;
      font-weight: normal;
      margin-bottom: 60px;
    }
    p {
      font-size: 20px;
      margin-bottom: 30px;
    }
    button {
      font-size: 16px;
      padding: 10px 28px;
      margin: 0 10px;
      cursor: pointer;
      border: 1px solid #333;
      background: #fff;
      border-radius: 4px;
    }
    button:hover {
      background: #f0f0f0;
    }
    #reveal {
      display: none;
      margin-top: 40px;
    }
    #reveal img {
      max-width: 90%;
      width: 420px;
      margin: 20px auto;
      display: block;
      border-radius: 14px;
      box-shadow: 0 0 25px rgba(255,92,168,0.35);
      opacity: 0;
      transform: scale(0.8);
      animation: popIn 0.6s ease forwards;
      animation-delay: 0.3s;
    }
    #reveal img:last-of-type {
      animation-delay: 0.6s;
    }
    @keyframes popIn {
      to { opacity: 1; transform: scale(1); }
    }
    #happy-msg {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #111111;
    }
    #love-msg {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 35px;
      color: #111111;
    }
    #no-msg {
      display: none;
      font-size: 26px;
      margin-top: 40px;
    }
    canvas {
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <h1>For Isa</h1>

  <div id="question">
    <p>do you want to be my girlfriend?</p>
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
  </div>

  <div id="reveal">
    <p id="happy-msg">YOU JUST MADE ME THE HAPPIEST BOY IN THE WORLD🥹</p>
    <p id="love-msg">I LOVE YOU SO MUCH MI AMORRR❤️💋</p>
    <img src="images/mj-crying.png" alt="" />
    <img src="images/curry-moon.png" alt="" />
  </div>

  <div id="no-msg">damn</div>

  <canvas id="confetti-canvas"></canvas>

  <audio id="bg-song" src="audio/my-kind-of-woman.mp3"></audio>

  <script>
    var yesBtn = document.getElementById('yesBtn');
    var noBtn = document.getElementById('noBtn');
    var question = document.getElementById('question');
    var reveal = document.getElementById('reveal');
    var noMsg = document.getElementById('no-msg');
    var bgSong = document.getElementById('bg-song');

    yesBtn.addEventListener('click', function () {
      question.style.display = 'none';
      reveal.style.display = 'block';
      document.body.classList.add('celebrate');
      launchConfetti();
      bgSong.play();
    });

    noBtn.addEventListener('click', function () {
      question.style.display = 'none';
      noMsg.style.display = 'block';
    });

    /* simple vanilla confetti, no external library */
    function launchConfetti() {
      var canvas = document.getElementById('confetti-canvas');
      var ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      var colors = ['#ff5ca8', '#ffca3a', '#8ac926', '#1982c4', '#6a4cff', '#ff914d', '#ff3864', '#fff'];
      var pieces = [];
      var count = 260;

      for (var i = 0; i < count; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * -canvas.height,
          size: 6 + Math.random() * 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          shape: Math.random() < 0.5 ? 'square' : 'circle',
          speedY: 2 + Math.random() * 3.5,
          speedX: (Math.random() - 0.5) * 2.5,
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 8
        });
      }

      var duration = 5500;
      var start = Date.now();

      function frame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var elapsed = Date.now() - start;

        for (var i = 0; i < pieces.length; i++) {
          var p = pieces[i];
          p.x += p.speedX;
          p.y += p.speedY;
          p.rotation += p.rotationSpeed;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation * Math.PI / 180);
          ctx.fillStyle = p.color;
          if (p.shape === 'circle') {
            ctx.beginPath();
            ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          }
          ctx.restore();
        }

        if (elapsed < duration) {
          requestAnimationFrame(frame);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(frame);
    }
  </script>

</body>
</html>
