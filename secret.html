<!DOCTYPE html>
<html>
<head>
  <title>For Isa</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 80px 20px;
      background: #ffffff;
      color: #111111;
    }
    h1 {
      font-size: 22px;
      font-weight: normal;
      margin-bottom: 60px;
    }
    p {
      font-size: 20px;
      margin-bottom: 30px;
    }
    button {
      font-size: 16px;
      padding: 10px 28px;
      margin: 0 10px;
      cursor: pointer;
      border: 1px solid #333;
      background: #fff;
      border-radius: 4px;
    }
    button:hover {
      background: #f0f0f0;
    }
    #reveal {
      display: none;
      margin-top: 40px;
    }
    #reveal img {
      max-width: 90%;
      width: 420px;
      margin: 15px auto;
      display: block;
    }
    #happy-msg {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 30px;
    }
    #no-msg {
      display: none;
      font-size: 26px;
      margin-top: 40px;
    }
    canvas {
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <h1>For Isa</h1>

  <div id="question">
    <p>do you want to be my girlfriend?</p>
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
  </div>

  <div id="reveal">
    <p id="happy-msg">YOU JUST MADE ME THE HAPPIEST BOY IN THE WORLD🥹</p>
    <img src="images/mj-crying.png" alt="" />
    <img src="images/curry-moon.png" alt="" />
  </div>

  <div id="no-msg">damn</div>

  <canvas id="confetti-canvas"></canvas>

  <script>
    var yesBtn = document.getElementById('yesBtn');
    var noBtn = document.getElementById('noBtn');
    var question = document.getElementById('question');
    var reveal = document.getElementById('reveal');
    var noMsg = document.getElementById('no-msg');

    yesBtn.addEventListener('click', function () {
      question.style.display = 'none';
      reveal.style.display = 'block';
      launchConfetti();
    });

    noBtn.addEventListener('click', function () {
      question.style.display = 'none';
      noMsg.style.display = 'block';
    });

    /* simple vanilla confetti, no external library */
    function launchConfetti() {
      var canvas = document.getElementById('confetti-canvas');
      var ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      var colors = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93'];
      var pieces = [];
      var count = 150;

      for (var i = 0; i < count; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * -canvas.height,
          size: 6 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          speedY: 2 + Math.random() * 3,
          speedX: (Math.random() - 0.5) * 2,
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 8
        });
      }

      var duration = 4000;
      var start = Date.now();

      function frame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var elapsed = Date.now() - start;

        for (var i = 0; i < pieces.length; i++) {
          var p = pieces[i];
          p.x += p.speedX;
          p.y += p.speedY;
          p.rotation += p.rotationSpeed;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation * Math.PI / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        }

        if (elapsed < duration) {
          requestAnimationFrame(frame);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(frame);
    }
  </script>

</body>
</html>
