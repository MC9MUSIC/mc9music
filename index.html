<!DOCTYPE html>
<html>
<head>
  <title>MC9 MUSIC OFFICIAL</title>
  <meta charset="utf-8">
  <meta name="description" content="MC9 — Producer from Weston, FL. Listen to The Mixtape and Radio.">
  <meta name="keywords" content="MC9, Music, Producer, Weston FL, Mixtape, Radio, free beats">
  <meta name="author" content="MC9">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Permanent+Marker&family=Space+Mono:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0e14;
    color: #e8ddd0;
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .sky-bg {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 25% 30%, rgba(58,170,110,0.08) 0%, transparent 45%),
                radial-gradient(circle at 75% 70%, rgba(201,145,47,0.10) 0%, transparent 45%),
                linear-gradient(180deg, #0a0e14 0%, #0d1117 50%, #0a0e14 100%);
    z-index: 0; pointer-events: none;
  }

  .container { max-width: 980px; margin: 0 auto; padding: 0 2rem; position: relative; z-index: 1; }

  nav {
    display: flex; justify-content: center; align-items: center;
    padding: 2rem; position: relative; z-index: 1;
  }
  .logo { font-family: 'Permanent Marker', cursive; font-size: 2.2rem; color: #e8ddd0; opacity: 0.9; }

  .intro { text-align: center; padding: 1rem 2rem 3rem; }
  .intro-eyebrow { font-size: 0.62rem; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(232,221,208,0.4); margin-bottom: 0.75rem; }
  .intro-title { font-family: 'Bebas Neue', sans-serif; font-size: 2.6rem; letter-spacing: 0.04em; color: #f0ead8; }

  .picker {
    display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;
    padding: 1rem 2rem 5rem; max-width: 980px; margin: 0 auto;
    align-items: start;
  }

  .radio-col { display: flex; flex-direction: column; }

  .secret-trigger {
    height: 64px; width: 100%; cursor: default;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }

  .secret-box {
    display: none; margin-top: 1rem;
    border: 1px dashed rgba(201,145,47,0.35);
    background: rgba(201,145,47,0.05);
    padding: 1.5rem; text-align: center;
  }
  .secret-box.visible { display: block; animation: secretFade 0.3s ease; }
  @keyframes secretFade { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .secret-hint { font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: #c9912f; margin-bottom: 0.9rem; line-height: 1.6; }
  .secret-input {
    width: 100%; background: rgba(245,236,216,0.05);
    border: 1px solid rgba(245,236,216,0.15); color: #f0ead8;
    padding: 0.9rem 0.9rem; font-family: 'Space Mono', monospace; font-size: 0.85rem;
    outline: none; margin-bottom: 0.75rem; text-align: center;
    transition: border-color 0.2s;
  }
  .secret-input:focus { border-color: #c9912f; }
  .secret-submit {
    background: #c9912f; color: #0a0a0a; border: none;
    padding: 0.8rem 1.8rem; font-family: 'Space Mono', monospace;
    font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase;
    font-weight: 700; cursor: pointer; transition: background 0.2s;
    touch-action: manipulation;
  }
  .secret-submit:hover { background: #e8b923; }
  .secret-error { display: none; color: #ff6666; font-size: 0.58rem; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 0.75rem; }

  .project-card {
    position: relative; display: block; text-decoration: none;
    border: 1px solid rgba(232,221,208,0.1);
    background: rgba(232,221,208,0.02);
    overflow: hidden;
    transition: transform 0.25s, border-color 0.25s;
  }
  .project-card:hover { transform: translateY(-4px); }

  .project-cover { width: 100%; aspect-ratio: 1 / 1; overflow: hidden; position: relative; }
  .project-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s; }
  .project-card:hover .project-cover img { transform: scale(1.05); }

  .project-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.85) 100%);
  }

  .project-info { padding: 1.5rem 1.5rem 1.75rem; }
  .project-label { font-size: 0.58rem; letter-spacing: 0.24em; text-transform: uppercase; margin-bottom: 0.6rem; }
  .project-name { font-family: 'Bebas Neue', sans-serif; font-size: 2.1rem; letter-spacing: 0.04em; color: #f0ead8; margin-bottom: 0.4rem; line-height: 1; }
  .project-meta { font-size: 0.62rem; color: rgba(232,221,208,0.4); letter-spacing: 0.08em; text-transform: uppercase; }

  .play-badge {
    position: absolute; top: 1.1rem; right: 1.1rem;
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; transition: transform 0.2s;
    backdrop-filter: blur(6px);
  }
  .project-card:hover .play-badge { transform: scale(1.1); }

  /* The Mixtape — teal/orange theme */
  .card-mixtape { border-color: rgba(58,170,110,0.18); }
  .card-mixtape:hover { border-color: rgba(58,170,110,0.5); }
  .card-mixtape .project-label { color: #3aaa6e; }
  .card-mixtape .play-badge { background: rgba(58,170,110,0.85); color: #0e1a2b; border: 1px solid #3aaa6e; }

  /* Radio — gold/black theme */
  .card-radio { border-color: rgba(201,145,47,0.18); }
  .card-radio:hover { border-color: rgba(201,145,47,0.5); }
  .card-radio .project-label { color: #c9912f; }
  .card-radio .play-badge { background: rgba(201,145,47,0.85); color: #0a0a0a; border: 1px solid #c9912f; }

  footer {
    border-top: 1px solid rgba(232,221,208,0.07);
    padding: 2.5rem 2rem;
    display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 1.5rem;
  }
  .footer-links { display: flex; gap: 0.75rem; }
  .footer-link {
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
    text-decoration: none; font-weight: 700;
    padding: 0.55rem 1.1rem; border: 1px solid;
    transition: background 0.2s;
  }
  .footer-link.yt { color: #ff4444; border-color: #ff4444; }
  .footer-link.yt:hover { background: #ff4444; color: #0a0a0a; }
  .footer-link.sc { color: #ff6600; border-color: #ff6600; }
  .footer-link.sc:hover { background: #ff6600; color: #0a0a0a; }
  .footer-copy { font-size: 0.58rem; color: rgba(232,221,208,0.25); width: 100%; text-align: center; margin-top: 0.5rem; }

  @media (max-width: 620px) {
    .picker { grid-template-columns: 1fr; gap: 1.5rem; padding: 1rem 1.5rem 3.5rem; }
    .intro-title { font-size: 2rem; }
    .logo { font-size: 1.8rem; }
    .secret-trigger { height: 90px; }
  }
</style>
</head>
<body>

<div class="sky-bg"></div>

<nav>
  <div class="logo">mc9</div>
</nav>

<div class="intro">
  <p class="intro-eyebrow">● Producer · Weston, FL</p>
  <h1 class="intro-title">Choose What To Play</h1>
</div>

<div class="picker">
  <a href="mc9_mixtape_v4.html" class="project-card card-mixtape">
    <div class="project-cover">
      <img src="images/MC9 Tape Album Cover.png" alt="The Mixtape album cover" />
      <div class="project-overlay"></div>
      <div class="play-badge">&#9654;</div>
    </div>
    <div class="project-info">
      <p class="project-label">● 9 Tracks</p>
      <h2 class="project-name">The Mixtape</h2>
      <p class="project-meta">Debut Producer Tape</p>
    </div>
  </a>

  <div class="radio-col">
    <a href="mc9_radio.html" class="project-card card-radio">
      <div class="project-cover">
        <img src="images/RADIO_MC9_ALBUM_COVER.png" alt="Radio MC9 album cover" />
        <div class="project-overlay"></div>
        <div class="play-badge">&#9654;</div>
      </div>
      <div class="project-info">
        <p class="project-label">● 7 Tracks</p>
        <h2 class="project-name">Radio MC9</h2>
        <p class="project-meta">New Producer Tape</p>
      </div>
    </a>

    <div class="secret-trigger" id="secret-trigger"></div>

    <div class="secret-box" id="secret-box">
      <p class="secret-hint">PASSWORD HINT: my favorite mac demarco song</p>
      <input type="text" class="secret-input" id="secret-input" placeholder="Enter the code" />
      <br>
      <button class="secret-submit" id="secret-submit">Unlock</button>
      <p class="secret-error" id="secret-error">Wrong code, try again.</p>
    </div>
  </div>
</div>

<footer>
  <div class="footer-links">
    <a href="https://www.youtube.com/@officialmc9music" target="_blank" class="footer-link yt">▶ YouTube</a>
    <a href="https://soundcloud.com/officialmc9music" target="_blank" class="footer-link sc">☁ SoundCloud</a>
  </div>
  <div class="footer-copy">© 2026 MC9. All beats reserved.</div>
</footer>

<script>
  let secretClicks = 0;
  const secretTrigger = document.getElementById('secret-trigger');
  const secretBox = document.getElementById('secret-box');
  const secretInput = document.getElementById('secret-input');
  const secretSubmit = document.getElementById('secret-submit');
  const secretError = document.getElementById('secret-error');

  /* ▼▼ Set the correct answer (case-insensitive) ▼▼ */
  const SECRET_ANSWER = "my kind of woman";
  /* ▼▼ Where the correct code sends them ▼▼ */
  const SECRET_PAGE = "secret.html";

  secretTrigger.addEventListener('click', () => {
    secretClicks++;
    if (secretClicks >= 3) {
      secretBox.classList.add('visible');
    }
  });

  function checkSecretCode() {
    const val = secretInput.value.trim().toLowerCase();
    if (val === SECRET_ANSWER) {
      window.location.href = SECRET_PAGE;
    } else {
      secretError.style.display = 'block';
      secretInput.value = '';
      secretInput.focus();
    }
  }

  secretSubmit.addEventListener('click', checkSecretCode);
  secretInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') checkSecretCode();
  });
</script>

</body>
</html>
